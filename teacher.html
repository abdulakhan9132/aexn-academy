<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Teacher Mode · AEXN Academy</title><style>*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#f1f5f9;font:16px/1.6 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:20px}header{background:#142445;padding:22px}header a{color:#b8c7ff;text-decoration:none}.card{border:1px solid #31415f;background:#121d32;border-radius:18px;padding:24px;margin:16px 0}h1{line-height:1.2}h2{font-size:23px}p{color:#c0cbe0}.pill{background:#2e4678;padding:6px 12px;border-radius:30px;font-size:12px}pre,.code,.result{background:#08101e;color:#b9f1ce;border-radius:12px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 Consolas,monospace}button{border:1px solid #4c628c;background:#273857;color:#fff;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit}button.primary{background:#536ce0;border-color:#536ce0}button:disabled{opacity:.4}input[type=text]{width:100%;background:#091425;border:1px solid #4c628c;border-radius:10px;color:white;font:inherit;padding:12px}.choice{display:block;padding:12px;border:1px solid #32415d;border-radius:10px;margin:8px 0;cursor:pointer}.feedback{padding:12px;background:#203454;border-radius:10px;margin-top:10px}.progress{background:#25334c;height:8px;border-radius:8px;overflow:hidden}.progress div{background:#8ca1ff;height:100%}.parts{display:grid;gap:8px}.parts div{padding:10px;background:#1c2d49;border-radius:10px}nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:500px){main{padding:12px}.card{padding:17px}}</style></head><body><header><div style="max-width:780px;margin:auto"><a href="./">← AEXN Academy</a><h1>Learn Python with your teacher</h1><p>One small lesson at a time. No experience needed.</p></div></header><main><div class="progress"><div id="progress"></div></div><p id="position"></p><div id="lesson"></div></main><script>
const lessons=[
{title:"Your first Python instruction",goal:"Tell the computer to display a message.",explain:"A computer follows instructions. Python is a language we use to write those instructions. The print() command displays a message on the screen.",code:'print("Hello AEXN GPT")',parts:[["print","Means display something on screen."],["( )","Holds the information to display."],['"Hello AEXN GPT"',"The text we want to show."]],question:"Which command displays a message?",options:["show()","print()","write()"],correct:1,exercise:"Change the message in the playground below and press Run.",play:true},
{title:"Variables are labeled boxes",goal:"Store a value and give it a name.",explain:"Imagine a box labeled model_name. You put the words AEXN GPT inside it. In Python, that box is called a variable.",code:'model_name = "AEXN GPT"\nprint(model_name)',parts:[["model_name","The name of the box."],["=","Puts a value into the box."],['"AEXN GPT"',"The value stored in the box."]],question:"Which line stores 4 in layers?",options:["4 = layers","layers == 4","layers = 4"],correct:2,exercise:"In VS Code, change the model name to your own AI name."},
{title:"Numbers and calculations",goal:"Use Python as a calculator.",explain:"Python understands numbers. + means add, - means subtract, * means multiply and / means divide. This helps when calculating AI training steps.",code:"layers = 4\nheads = 4\nprint(layers * heads)",parts:[["layers = 4","Store the number 4."],["*","Multiply numbers."],["print(...)","Display the result."]],question:"What does print(3 + 2) display?",options:["32","5","6"],correct:1,exercise:"Try print(4 * 8) and predict the result."},
{title:"Make decisions with if",goal:"Teach a program to choose what happens.",explain:"An if statement asks a yes-or-no question. When the answer is True, the indented instruction runs.",code:'ready = True\nif ready:\n    print("AEXN GPT is ready")',parts:[["ready = True","Save a yes/no value."],["if ready:","Check whether it is true."],["    print(...)","Run this indented instruction when true."]],question:"Which keyword checks a condition?",options:["if","print","for"],correct:0,exercise:"Change ready to False. Predict whether the message appears."},
{title:"Repeat instructions with loops",goal:"Repeat an action without writing it many times.",explain:"A loop repeats instructions. AI training also uses loops to process data repeatedly.",code:'for epoch in range(3):\n    print("Training epoch", epoch)',parts:[["for","Starts a repetition."],["range(3)","Produces 0, 1 and 2."],["print(...)","Runs once per repetition."]],question:"How many times does range(3) repeat?",options:["2","3","4"],correct:1,exercise:"Change range(3) to range(5)."}
];let idx=Math.max(0,Math.min(lessons.length-1,Number(localStorage.getItem("aexn-teacher-step")||0)));const root=document.getElementById("lesson");function render(){const l=lessons[idx];document.getElementById("position").textContent="Lesson "+(idx+1)+" of "+lessons.length;document.getElementById("progress").style.width=((idx+1)/lessons.length*100)+"%";root.innerHTML='<div class="card"><span class="pill">BEGINNER · LEVEL '+(idx+1)+'</span><h2>'+l.title+'</h2><p><strong>Today’s goal:</strong> '+l.goal+'</p></div><div class="card"><h2>1. Teacher explains</h2><p>'+l.explain+'</p><h2>2. Look at this code</h2><pre id="sample"></pre><h2>3. Understand every part</h2><div class="parts" id="parts"></div></div><div class="card"><h2>4. Your practice</h2><p>'+l.exercise+'</p><div id="playground"></div></div><div class="card"><h2>5. Quick question</h2><p><strong>'+l.question+'</strong></p><div id="choices"></div><button id="check" class="primary">Check my answer</button><div id="feedback" aria-live="polite"></div></div><nav><button id="prev" '+(idx===0?'disabled':'')+'>← Previous lesson</button><button id="next" class="primary" '+(idx===lessons.length-1?'disabled':'')+'>Next lesson →</button></nav>';document.getElementById("sample").textContent=l.code;const parts=document.getElementById("parts");l.parts.forEach(([name,desc])=>{const d=document.createElement("div"),b=document.createElement("strong");b.textContent=name;d.append(b,document.createTextNode(" — "+desc));parts.append(d)});const choices=document.getElementById("choices");l.options.forEach((o,i)=>{const label=document.createElement("label");label.className="choice";const input=document.createElement("input");input.type="radio";input.name="answer";input.value=i;label.append(input,document.createTextNode(" "+o));choices.append(label)});document.getElementById("check").onclick=()=>{const chosen=document.querySelector('input[name="answer"]:checked');document.getElementById("feedback").innerHTML='<div class="feedback">'+(!chosen?"Choose an answer first.":Number(chosen.value)===l.correct?"✓ Excellent! You understood it.":"Not quite. Look at the example again and try once more.")+'</div>'};if(l.play){const p=document.getElementById("playground");p.innerHTML='<label for="message">Message to display</label><input type="text" id="message" value="Hello AEXN GPT"><pre id="preview"></pre><button class="primary" id="run">▶ Run program</button><div class="result" id="output">Your output appears here</div><p style="font-size:12px">This playground demonstrates print(); it is not a complete Python interpreter.</p>';const input=document.getElementById("message"),preview=document.getElementById("preview");const update=()=>preview.textContent="print("+JSON.stringify(input.value)+")";input.addEventListener("input",update);update();document.getElementById("run").onclick=()=>document.getElementById("output").textContent=input.value||"(empty text)"}document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1)}function move(n){idx=Math.max(0,Math.min(lessons.length-1,idx+n));localStorage.setItem("aexn-teacher-step",idx);render();scrollTo({top:0,behavior:"smooth"})}render();
</script></body></html>
